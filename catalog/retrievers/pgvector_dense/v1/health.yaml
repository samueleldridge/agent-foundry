name: pgvector_dense_v1_health
description: One trivial query must return at least one document.
scope: retriever
target: catalog/pgvector_dense@v1
cases:
  - id: nonempty_corpus
    input: {query: "smoke test", top_k: 1}
    expected:
      min_documents: 1
scorers:
  - kind: exact
    name: min_documents_check
threshold: 1.0
deterministic: false
schema_version: 1
