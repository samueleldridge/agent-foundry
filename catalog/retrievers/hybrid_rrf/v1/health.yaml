name: hybrid_rrf_v1_health
description: One trivial query must return at least one merged document.
scope: retriever
target: catalog/hybrid_rrf@v1
cases:
  - id: nonempty_merge
    input: {query: "smoke test", top_k: 1}
    expected:
      min_documents: 1
scorers:
  - kind: exact
    name: min_documents_check
threshold: 1.0
deterministic: false
schema_version: 1
