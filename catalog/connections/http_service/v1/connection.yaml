name: http_service
version: v1
description: |
  Generic HTTP JSON service over httpx with API-key header auth. The
  binding supplies base_url; credentials supply the key (env or secret
  manager). v2 of this connection swaps the scheme to basic auth.
auth_scheme: api_key
config_schema: schemas.py::HTTPServiceConfig
factory: auth.py::build_connection
client_type: httpx.AsyncClient
health_check: health.yaml
refresh:
  mode: on_auth_error
pool:
  max_concurrent: 16
  acquire_timeout_s: 10.0
non_sensitive_config_fields: [base_url, timeout_s, health_path]
tags: [http, generic]
author: foundry-team
created_at: 2026-07-07T00:00:00Z
schema_version: 1
