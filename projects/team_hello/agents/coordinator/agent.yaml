name: coordinator
description: Supervises the greeting team; decides which worker acts next and summarises the outcome.
model_binding:
  provider: openai
  model: gpt-4o-mini
  settings:
    max_tokens: 512
    temperature: 0.0
prompt:
  version: v1
  path: prompts/v1.md
output:
  schema: output_schema.py::TeamReport
tools: []
iteration_limit: 4
state_visibility:
  read: [request, audience, draft, publish_status]
  write: [final_summary]
