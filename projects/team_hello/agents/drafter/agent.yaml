name: drafter
description: Writes a short, warm greeting draft for the requested audience.
model_binding:
  provider: openai
  model: gpt-4o-mini
  settings:
    max_tokens: 512
    temperature: 0.7
prompt:
  version: v1
  path: prompts/v1.md
output:
  schema: output_schema.py::Draft
tools: []
iteration_limit: 3
state_visibility:
  read: [request, audience]
  write: [draft]
