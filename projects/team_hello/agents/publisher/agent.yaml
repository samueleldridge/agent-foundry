name: publisher
description: Publishes the approved greeting draft via the publish_greeting tool (human approval required).
model_binding:
  provider: openai
  model: gpt-5-mini
  settings:
    # gpt-5-mini is a reasoning model: max_tokens maps to max_completion_tokens,
    # which budgets hidden reasoning + visible output together.
    max_tokens: 4096
    temperature: 0.0
prompt:
  version: v1
  path: prompts/v1.md
output:
  schema: output_schema.py::PublishOutcome
tools: [publish_greeting]
iteration_limit: 4
state_visibility:
  read: [draft]
  write: [publish_status]
