name: publisher
description: Publishes the approved greeting draft via the publish_greeting tool (human approval required).
model_binding:
  provider: anthropic
  model: claude-haiku-4-5
  settings:
    max_tokens: 512
    temperature: 0.0
prompt:
  version: v1
  path: prompts/v1.md
output:
  schema: output_schema.py::PublishOutcome
tools: [publish_greeting]
iteration_limit: 4
state_visibility:
  read: [draft]
  write: [publish_status]
