# rag_hello — the Phase 2b example system.
# One agent answering questions from a local corpus through a hybrid
# (dense + sparse, RRF) retriever with a local lexical rerank stage, a
# semantic cache over the whole agent step, and a cacheable retrieval tool.
# Everything runs on in_process backends — a single OPENAI_API_KEY covers
# both the LLM and the embedder; the reranker is fully local.
name: rag_hello
description: Answers questions from a bundled knowledge corpus via hybrid retrieval + rerank; demonstrates semantic caching and tool-result caching end-to-end.
agents: [rag_agent]
state: state.yaml
flow:
  type: single
  agent: rag_agent
tools:
  search_docs:
    ref: local/search_docs
    version: v1
guardrails:
  max_iterations: 5
