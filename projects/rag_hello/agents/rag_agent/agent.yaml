name: rag_agent
description: Answers questions strictly from the retrieved knowledge-base context, citing document ids.
model_binding:
  provider: openai
  model: gpt-5-mini
  settings:
    # gpt-5-mini is a reasoning model: max_tokens maps to max_completion_tokens,
    # which budgets hidden reasoning + visible output together.
    max_tokens: 4096
    temperature: 0.0
prompt:
  version: v1
  path: prompts/v1.md
output:
  schema: output_schema.py::Answer
tools: [search_docs]
iteration_limit: 4
state_visibility:
  read: [query]
  write: [answer]
semantic_cache:
  embedder_binding:
    provider: openai
    model: text-embedding-3-small
  similarity_threshold: 0.95
  ttl_s: 3600
  scope: agent
  backend: in_process
retrievers:
  - slot: knowledge_base
    ref: catalog/hybrid_rrf
    version: v1
    top_k: 8
    config:
      dense:
        ref: local/docs_dense
        version: v1
        config:
          corpus_path: corpus.json
          # text-embedding-3-small emits 1536-dim vectors; the load-time
          # dimension check rejects any mismatch before a single call.
          dimensions: 1536
          embedder_binding:
            provider: openai
            model: text-embedding-3-small
      sparse:
        ref: local/docs_sparse
        version: v1
        config:
          corpus_path: corpus.json
      rrf_k: 60
    # Local lexical-overlap rerank stage: zero egress, zero extra keys —
    # the whole project runs on OPENAI_API_KEY alone.
    reranker:
      ref: catalog/local_rerank
      version: v1
      top_k: 3
