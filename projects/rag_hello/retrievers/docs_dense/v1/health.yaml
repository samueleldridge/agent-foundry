name: docs_dense_v1_health
description: A trivial query must return at least one corpus document.
scope: retriever
target: local/docs_dense@v1
cases:
  - id: nonempty_corpus
    input: {query: "capital", top_k: 1}
    expected:
      min_documents: 1
scorers:
  - kind: exact
    name: min_documents_check
threshold: 1.0
deterministic: false
schema_version: 1
