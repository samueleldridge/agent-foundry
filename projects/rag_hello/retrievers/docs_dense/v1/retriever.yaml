name: docs_dense
version: v1
description: |
  In-process dense retriever over the project's bundled corpus.json: embeds
  the corpus lazily on first retrieve (purpose=document), then brute-force
  cosine search. No infra — the vector index lives in memory for the run.
kind: dense
config_schema: schemas.py::DocsDenseConfig
factory: factory.py::build_retriever
connections_required: []
health_check: health.yaml
tags: [retrieval, dense, in-process]
author: foundry-team
created_at: 2026-07-08T00:00:00Z
schema_version: 1
