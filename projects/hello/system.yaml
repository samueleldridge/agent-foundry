# hello — the trivial example system (Phase 2a shape).
# One agent, one catalog tool through one catalog connection:
# model -> get_time tool (pooled, authenticated http_service) -> model.
name: hello
description: Trivial single-agent system that greets the caller by name, mentioning the current time fetched through a catalog tool + connection.
agents: [hello_agent]
state: state.yaml
flow:
  type: single
  agent: hello_agent
tools:
  get_time:
    ref: catalog/http_get_json
    version: v1
    connection_bindings:
      service: time_service
connections:
  time_service:
    ref: catalog/http_service
    version: v1
    config:
      base_url: ${ENV:HELLO_TIME_BASE_URL:https://worldtimeapi.org}
      health_path: /api/ip
    credentials_ref:
      kind: env
      value: HELLO_SERVICE_API_KEY
guardrails:
  max_iterations: 5
  # max_cost_usd: "0.01"   # uncomment to exercise CostBudget enforcement
