name: hello_agent
description: Greets the caller by name, warmly and briefly, mentioning the current time fetched via the get_time tool.
model_binding:
  provider: anthropic
  model: claude-haiku-4-5
  settings:
    max_tokens: 512
    temperature: 0.7
prompt:
  version: v2
  path: prompts/v2.md
output:
  schema: output_schema.py::Greeting
tools: [get_time]
iteration_limit: 4
state_visibility:
  read: [name]
  write: [greeting]
