name: hello_agent
description: Greets the caller by name, warmly and briefly, mentioning the current time fetched via the get_time tool.
model_binding:
  provider: openai
  model: gpt-5-mini
  settings:
    # gpt-5-mini is a reasoning model: max_tokens maps to max_completion_tokens,
    # which budgets hidden reasoning + visible output together.
    max_tokens: 4096
    temperature: 0.7
prompt:
  version: v2
  path: prompts/v2.md
output:
  schema: output_schema.py::Greeting
tools: [get_time]
iteration_limit: 4
state_visibility:
  read: [name]
  write: [greeting]
