name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff, incl. import-boundary rules)
        run: uv run ruff check src/ tests/ scripts/

      - name: Types (mypy --strict)
        run: uv run mypy --strict src/foundry/

      - name: Tests (no network, no keys — mock transports throughout)
        # Failures are re-emitted as ::error annotations so they're visible
        # on the run page (and via the public API) without opening the log.
        run: |
          set -o pipefail
          uv run pytest tests/ -q --tb=line 2>&1 | tee pytest.out || {
            grep -E "^(FAILED|ERROR)" pytest.out | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }
