name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff, incl. import-boundary rules)
        run: uv run ruff check src/ tests/ scripts/

      - name: Types (mypy --strict)
        run: uv run mypy --strict src/foundry/

      - name: Tests (no network, no keys — mock transports throughout)
        run: uv run pytest tests/ -q
