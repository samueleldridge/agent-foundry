# Local end-to-end stack: the foundry API serving projects/hello + an OTel
# collector printing every span/metric it receives (docs/84 manual checklist).
#
#   ANTHROPIC_API_KEY=... FOUNDRY_API_TOKENS=... \
#     docker compose -f deploy/docker-compose.otel.yaml up --build
#
# Secrets ride the shell environment (never this file).
services:
  foundry-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      FOUNDRY_ENV: prod
      FOUNDRY_TRACING: otel
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      FOUNDRY_API_TOKENS: ${FOUNDRY_API_TOKENS:?set FOUNDRY_API_TOKENS in your shell}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell}
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
